<!--
  Stopka mailowa Machinekind.

  Skopiuj zawartość <table> do ustawień podpisu w kliencie pocztowym.
  Style są w atrybutach `style`, bo klienty pocztowe usuwają arkusze stylów,
  a układ trzyma tabela, bo Outlook nie liczy flexboxa.

  Kroje marki nie działają w poczcie — żaden klient nie wczyta pliku woff2.
  Podpis stoi więc na Arialu i Helvetice, a markę niesie kolor, znak
  i sposób prowadzenia tekstu. Nie podmieniaj tego na krój marki „na siłę":
  część odbiorców zobaczy wtedy losowy zamiennik.

  ZNAK: obrazek musi stać pod publicznym adresem — poczta nie wyświetla
  plików z dysku ani data URI (Gmail je wycina). Wgraj
  `../../logo/png/mark-red-128.png` na serwer strony i wstaw jego adres
  w miejsce ZNAK_URL poniżej. Wariant bez obrazka leży w `podpis-tekstowy.html`.
-->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif">
  <tr>
    <td style="padding:0 16px 0 0;vertical-align:top">
      <img
        src="ZNAK_URL"
        width="44"
        height="38"
        alt="Machinekind"
        style="display:block;border:0;width:44px;height:38px"
      />
    </td>
    <td style="padding:0;vertical-align:top;border-left:2px solid #bd3e3e">
      <div style="padding-left:16px">
        <div style="font-size:15px;line-height:20px;font-weight:bold;color:#0d0f10">
          Imię Nazwisko
        </div>
        <div style="font-size:13px;line-height:19px;color:#4e5558">
          Rola w zespole · Machinekind
        </div>
        <div style="font-size:13px;line-height:19px;color:#4e5558;padding-top:8px">
          <a href="mailto:hello@wo1.tech" style="color:#bd3e3e;text-decoration:none">hello@wo1.tech</a>
          &nbsp;·&nbsp;
          <a href="https://machinekind.ai" style="color:#bd3e3e;text-decoration:none">machinekind.ai</a>
        </div>
        <div style="font-size:11px;line-height:17px;color:#6b7376;letter-spacing:1px;text-transform:uppercase;padding-top:10px">
          Kolektyw robotyki i AI · Wrocław
        </div>
      </div>
    </td>
  </tr>
