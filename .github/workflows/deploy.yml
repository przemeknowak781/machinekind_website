name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Wymagane przez actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; kolejkuj zamiast przerywać trwające.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Zwraca base_path i origin: przy własnej domenie `/`, przy adresie
      # projektowym `/machinekind_website`. Dzięki temu ta sama konfiguracja
      # działa w obu przypadkach.
      - name: Ustal adres Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Zbuduj stronę
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
